<svg xmlns="http://www.w3.org/2000/svg" width="900" height="786" viewBox="0 0 900 786" role="img" aria-labelledby="ttl desc">
<title id="ttl">scalable_mcp — request pipeline</title>
<desc id="desc">A request passes top-down through four middleware layers assembled by create_app: rate limit, auth, CORS and timeout. Rate limiting is outermost so unauthenticated floods are throttled before auth does any work. Rate limit denies with 429 and Retry-After, auth denies with 401 and WWW-Authenticate using one uniform message for every failure mode, and an expired request returns 504. Requests that pass reach the tool handler with current_tenant set, and every response carries three security headers, with unhandled exceptions returned as an opaque 500 keyed by an error UUID.</desc>

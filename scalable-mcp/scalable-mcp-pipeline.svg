<text x="34" y="68" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B6760">Order is assembled by create_app, not left to the consumer to wire correctly.</text>
